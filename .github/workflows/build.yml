name: Build stolbikvisual

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -nE "error:|warning: \[|What went wrong|Could not|FAILED|Caused by" build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          grep -nA6 "What went wrong" build.log | head -20 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stolbikvisual-jar
          path: |
            build/libs/stolbikvisual-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
