name: Build stolbikvisual

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          grep -A3 "error:" build.log | head -40 | sed 's|/home/runner/work/[^/]*/[^/]*/src/main/java/||' | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stolbikvisual-jar
          path: |
            build/libs/stolbikvisual-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish jar as release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/stolbikvisual-*.jar | grep -v sources | head -1)
          gh release delete stolbikvisual-latest -y --cleanup-tag || true
          gh release create stolbikvisual-latest "$JAR" --title "stolbik visual (latest build)" --notes "Auto-built jar. Based on ideas of EnoughVisuals (enoughvisuals.fun), code written from scratch." --target "${GITHUB_SHA}"
